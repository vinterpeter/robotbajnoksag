<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robotgyár</title>
<style>
  :root { --tinta: #3a3a3a; --piros: #e2452b; --papir: #fbf7ee; --kek: #eef6ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--papir); color: #2e2e2e; font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
  h1, h2, .kezi, button { font-family: "Chalkboard SE", "Marker Felt", "Comic Sans MS", cursive; }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 18px 28px 6px; }
  h1 { margin: 0; font-size: 40px; color: var(--piros); }
  header p { margin: 0; color: #666; flex: 1 1 260px; }
  button { font-size: 18px; border: 2.5px solid var(--tinta); border-radius: 14px; background: #fff; padding: 9px 18px; cursor: pointer; box-shadow: 3px 3px 0 var(--tinta); }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--tinta); }
  button.fo { background: var(--piros); color: #fff; font-size: 22px; }
  main { display: grid; grid-template-columns: minmax(320px, 1.1fr) minmax(320px, 1fr); gap: 24px; padding: 10px 28px 20px; align-items: start; max-width: 1280px; margin: 0 auto; }
  .tabla { background: #fff; border: 3px solid var(--tinta); border-radius: 22px; padding: 6px; }
  svg.robot { width: 100%; height: auto; display: block; }
  svg.robot:not(.mini) { max-height: 78vh; margin: 0 auto; }
  svg.robot * { vector-effect: non-scaling-stroke; }
  .kartya { background: var(--kek); border: 3px solid var(--tinta); border-radius: 22px; padding: 16px 20px 18px; }
  .nev { font-size: 34px; margin: 0; line-height: 1.1; }
  .kod { color: #777; font-size: 13px; margin: 2px 0 12px; }
  .ertekek { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; margin-bottom: 14px; }
  .sav { height: 16px; border: 2px solid var(--tinta); border-radius: 9px; background: #fff; overflow: hidden; }
  .sav i { display: block; height: 100%; background: var(--piros); }
  .ertekek b { font-weight: 600; } .ertekek span { font-variant-numeric: tabular-nums; }
  dl { margin: 0 0 12px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
  dt { font-weight: 600; white-space: nowrap; } dd { margin: 0; }
  .reszek { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 10px; }
  .resz { display: flex; align-items: center; gap: 8px; background: #fff; border: 2px solid #9a9a9a; border-radius: 12px; padding: 4px 6px 4px 10px; }
  .resz small { color: #777; display: block; line-height: 1.1; } .resz div { flex: 1; min-width: 0; }
  .resz strong { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .resz button { font-size: 15px; padding: 2px 9px; border-width: 2px; border-radius: 10px; box-shadow: 2px 2px 0 var(--tinta); }
  .csapat { padding: 0 28px 34px; max-width: 1280px; margin: 0 auto; }
  .csapat h2 { margin: 6px 0 10px; font-size: 26px; }
  .sor { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .kicsi { background: #fff; border: 2.5px solid var(--tinta); border-radius: 16px; padding: 4px 4px 8px; cursor: pointer; text-align: center; }
  .kicsi:hover { background: #fff8e6; }
  .kicsi span { font-size: 15px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } .sor { grid-template-columns: repeat(3, 1fr); } }
  @media print { header button, .csapat, .resz button { display: none; } body { background: #fff; } main { grid-template-columns: 1fr 1fr; padding: 0; } header { padding: 0 0 8px; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="kez" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="z"/><feDisplacementMap in="SourceGraphic" in2="z" scale="4"/></filter>
</defs></svg>
<header>
  <h1>Robotgyár</h1>
  <p>A gyár véletlen adatokból rak össze egy robotot. Ha egy alkatrész nem tetszik, a mellette lévő gombbal kicserélheted.</p>
  <button class="fo" id="uj">Új robot!</button>
  <button id="nyomtat">Nyomtatás</button>
</header>
<main>
  <div class="tabla" id="tabla"></div>
  <div class="kartya" id="kartya"></div>
</main>
<section class="csapat">
  <h2>Robotcsapat <button id="ujcsapat" style="font-size:16px;padding:4px 12px;margin-left:10px">Új csapat</button></h2>
  <div class="sor" id="sor"></div>
</section>

  for (let i = 0; i < 6; i++) {
    const r = ujRobot(Math.floor(Math.random() * 900000) + 100000), d = document.createElement('div');
    d.className = 'kicsi'; d.innerHTML = rajz(r, true) + `<span class="kezi">${r.nev}</span>`;
    d.onclick = () => { most = r; mutat(); scrollTo({ top: 0, behavior: 'smooth' }); };
    sor.appendChild(d);
  }
}
document.getElementById('uj').onclick = () => { most = ujRobot(Math.floor(Math.random() * 900000) + 100000); mutat(); };
document.getElementById('ujcsapat').onclick = csapat;
document.getElementById('nyomtat').onclick = () => print();
document.getElementById('kartya').onclick = ev => {
  const k = ev.target.dataset && ev.target.dataset.k; if (!k) return;
  const n = ADAT[k].length, kotelezo = SOROK.find(s => s[0] === k)[2] === 1;
  let uj = most.resz[k] + 1; if (uj >= n) uj = kotelezo ? 0 : -1;      // sorban végigmegy a változatokon, a végén „nincs”
  most.resz[k] = uj; mutat();
};
most = ujRobot(parseInt(location.hash.slice(1)) || Math.floor(Math.random() * 900000) + 100000);
mutat(); csapat();
const racs = new URLSearchParams(location.search).get('racs');
if (racs) {   // ellenőrző nézet: sok robot egyszerre
  document.querySelector('main').style.display = 'none'; const sor = document.getElementById('sor'); sor.innerHTML = '';
  for (let i = 0; i < +racs; i++) { const r = ujRobot(1000 + i * 7919), d = document.createElement('div'); d.className = 'kicsi'; d.innerHTML = rajz(r, true) + `<span class="kezi">${r.nev}</span>`; sor.appendChild(d); }
}
</script>
